name = "everest-cfo-agent"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "CFO_AGENT"
class_name = "CfoAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CfoAgent"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"

# Secrets (set via `wrangler secret put` / GitHub Actions, never committed):
#   CFO_AGENT_SUPABASE_URL       - Supabase project URL
#   CFO_AGENT_SUPABASE_ANON_KEY  - legacy `anon` key, used only as the `apikey` header (Kong
#                                  gateway auth) — anon has zero grants on finance/winnerdata
#   CFO_AGENT_SUPABASE_KEY       - long-lived self-signed JWT ({role: cfo_agent_ro}), used as
#                                  the `Authorization` header — this is what actually scopes
#                                  Postgres access via RLS. See worker/docs/PORTING_NOTES.md.
#   CFO_AGENT_SHARED_SECRET      - single-user access gate (X-CFO-Secret header)
#   DEEPSEEK_API_KEY             - optional. Health-score reasoning falls back to static text if
#                                  absent (as before). Issue #19810 (invoice audit) ALSO uses
#                                  this for LLM extraction/dispute-drafting when present, with a
#                                  deterministic fallback (regex parser / template letter) when
#                                  it isn't -- see worker/src/lib/invoiceExtract.ts and
#                                  invoiceDispute.ts. Still not provisioned on this Worker as of
#                                  2026-09-03 (open item carried from #19764).
#
# Issue #19810 (invoice audit) needs no new Worker secret for the Vercel usage-verification
# adapter -- it reads the vendor credential from Supabase vault via the new, narrowly-gated
# public.cfo_invoice_get_vendor_credential(name) RPC (allow-listed to
# 'vercel_api_token_brevardbidderai' only), using the existing cfo_agent_ro JWT this Worker
# already holds. That vault entry does not exist yet -- Ariel needs to create it once the
# brevardbidderai@gmail.com Vercel account issues a scoped API token.
