name: TMP - unify CFO_AGENT_SHARED_SECRET (issue 19753, add/use/remove)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Mask + push this repo's CFO_AGENT_SHARED_SECRET onto cli-anything-biddeed
        env:
          GH_TOKEN: ${{ secrets.TMP_CROSS_REPO_PAT_19753 }}
          SECRET_VAL: ${{ secrets.CFO_AGENT_SHARED_SECRET }}
        run: |
          if [ -z "$SECRET_VAL" ]; then
            echo "::error::CFO_AGENT_SHARED_SECRET is empty on this repo"
            exit 1
          fi
          echo "::add-mask::$SECRET_VAL"
          gh secret set CFO_AGENT_SHARED_SECRET --repo breverdbidder/cli-anything-biddeed --body "$SECRET_VAL"
          echo "Pushed CFO_AGENT_SHARED_SECRET (value not printed) to breverdbidder/cli-anything-biddeed."
