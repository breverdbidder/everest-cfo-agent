name: DIAG - final live verify (temporary)
on:
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Curl live worker endpoints post-fix
        env:
          SECRET: ${{ secrets.CFO_AGENT_SHARED_SECRET }}
        run: |
          set -euo pipefail
          BASE="https://everest-cfo-agent.brevardbidderai.workers.dev"
          for ep in checkpoints ledgers billable-ff; do
            echo "=== /api/$ep ==="
            code=$(curl -s -o /tmp/out.json -w "%{http_code}" -H "X-CFO-Secret: $SECRET" "$BASE/api/$ep")
            echo "HTTP_$code"
            head -c 2000 /tmp/out.json
            echo
            echo
          done
      - name: Negative test - wrong secret must be rejected
        run: |
          set -euo pipefail
          BASE="https://everest-cfo-agent.brevardbidderai.workers.dev"
          echo "=== negative test: /api/checkpoints with bogus X-CFO-Secret ==="
          code=$(curl -s -o /tmp/neg.json -w "%{http_code}" -H "X-CFO-Secret: definitely-wrong-value" "$BASE/api/checkpoints")
          echo "HTTP_$code"; cat /tmp/neg.json; echo
