name: "TEMP: blank cash/cashflow chart repro against live site (issue #19769, delete after use)"
on:
  workflow_dispatch: {}

jobs:
  proof:
    runs-on: ubuntu-latest
    env:
      SECRET: ${{ secrets.CFO_AGENT_SHARED_SECRET }}
      BASE: https://everest-cfo-agent.brevardbidderai.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: npm install -D playwright && npx playwright install --with-deps chromium

      - name: Real-browser repro against live deployed site (no secret printed)
        run: |
          mkdir -p /tmp/shots
          node - <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const base = process.env.BASE;
            const secret = process.env.SECRET;
            const browser = await chromium.launch();
            const ctx = await browser.newContext({ viewport: { width: 1440, height: 1400 } });
            const page = await ctx.newPage();
            const logs = [];
            page.on('console', (msg) => logs.push(`console.${msg.type()}: ${msg.text()}`));
            page.on('pageerror', (err) => logs.push(`pageerror: ${err.stack || err.message}`));
            page.on('requestfailed', (req) => logs.push(`requestfailed: ${req.url()} ${req.failure()?.errorText}`));

            await page.goto(base, { waitUntil: 'networkidle' });
            await page.getByLabel('Access key').fill(secret);
            await page.getByRole('button', { name: 'Enter' }).click();

            // Live cold-start Durable Object + serial Supabase reads can take a while --
            // poll for the loading skeletons to clear instead of a fixed short timeout.
            try {
              await page.waitForSelector('.skeleton-chart', { state: 'detached', timeout: 30000 });
            } catch (e) {
              logs.push(`skeleton-wait-timeout: ${e.message}`);
            }
            await page.waitForTimeout(1000);

            const report = [];
            const cards = await page.locator('.chart-card').all();
            for (const card of cards) {
              const title = (await card.locator('h2').first().textContent().catch(() => '?'))?.trim();
              const canvasDiv = card.locator('.chart-canvas').first();
              const exists = await canvasDiv.count();
              let box = null, svgIn = 0, innerLen = 0;
              if (exists) {
                box = await canvasDiv.boundingBox().catch(() => null);
                svgIn = await canvasDiv.locator('svg').count();
                innerLen = (await canvasDiv.innerHTML().catch(() => '')).length;
              }
              report.push({ title, exists: !!exists, box, svgIn, innerHtmlLen: innerLen });
            }
            require('fs').writeFileSync('/tmp/shots/report.json', JSON.stringify(report, null, 2));
            require('fs').writeFileSync('/tmp/shots/console.log', logs.join('\n'));
            const cashCard = page.locator('.chart-card').filter({ hasText: 'Cash balance' }).first();
            const cashHtml = await cashCard.innerHTML().catch((e) => 'ERR:' + e.message);
            require('fs').writeFileSync('/tmp/shots/cash_card.html', cashHtml);
            console.log(JSON.stringify(report, null, 2));
            console.log('--- console/page log ---');
            console.log(logs.join('\n'));

            await page.screenshot({ path: '/tmp/shots/live_desktop_full.png', fullPage: true });

            await browser.close();
          })().catch((e) => { console.error(e); process.exit(1); });
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: blank-chart-repro-19769
          path: /tmp/shots/
          retention-days: 7
